name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'  # every 14 minutes (within GitHub free tier limits)
  workflow_dispatch:          # allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.RENDER_URL }}/ping)
          echo "Response code: $response"
          if [ "$response" == "200" ]; then
            echo "✅ Server is alive!"
          else
            echo "⚠️ Warning: Got $response instead of 200"
            exit 1
          fi
